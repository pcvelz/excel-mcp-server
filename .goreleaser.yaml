version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/excel-mcp-server/main.go
    # Stamp the version the package actually ships under. GoReleaser's default
    # is {{.Version}}, which under --snapshot derives from the last git TAG, so
    # every published build reported the PREVIOUS release's number (v0.15.5 on
    # npm reported 0.15.4-SNAPSHOT-1065434). npm run build passes the version
    # from package.json, which is the real source of truth for this package.
    # Without it (goreleaser release from a tag in CI) fall back to the tag
    # rather than to "dev", so no goreleaser build can ship unversioned.
    ldflags:
      - -s -w -X main.version={{ envOrDefault "PKG_VERSION" .Version }}
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: ['tar.gz']
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ['zip']
    builds_info:
      mode: 0755

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
